name: Fork artifacts
on:
  pull_request:
    paths:
      - artifacts/plugins/**
      - artifacts/check.mjs
      - .github/workflows/fork-artifacts.yml
      - packages/**
      - native/**
      - vendor/**
      - pnpm-lock.yaml
      - tsconfig*.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  artifacts:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node artifacts/check.mjs --build-upstream
